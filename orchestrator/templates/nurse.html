<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="__CSRF__"><title>EuTaxo | Nurse</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{--ok:#2ee59d;--warn:#ffb020;--bad:#ff5470;--acc:#6ea8ff}
body{min-height:100vh;color:#e8ecf8;background:radial-gradient(1000px 500px at 5% -10%,#18295a,transparent 60%),radial-gradient(800px 450px at 100% 0,#2d1856,transparent 55%),#070b16}
.glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;backdrop-filter:blur(14px)}
.tilt{transition:transform .15s;transform-style:preserve-3d}.t2{border-left:4px solid var(--bad)}.t1{border-left:4px solid var(--warn)}
</style>
</head>
<body>
<nav class="glass d-flex flex-wrap justify-content-between align-items-center gap-2 px-3 py-2 m-3 mb-2">
  <span class="fs-5 fw-bold"><i class="bi bi-heart-pulse-fill text-danger"></i> EuTaxo <span style="color:var(--acc)">Nurse</span></span>
  <span class="small"><i class="bi bi-person-badge"></i> <span id="who">__NAME__</span> | assisting <b id="doc">-</b> | <i class="bi bi-clock"></i> <span id="shift"></span></span>
  <button class="btn btn-sm btn-outline-secondary" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Log out</button>
</nav>
<main class="container-fluid px-3 pb-4">
  <div id="off" class="glass p-5 text-center d-none"><i class="bi bi-moon-stars fs-1 text-secondary"></i>
    <div class="fs-5 mt-2">You are off shift</div><div class="text-secondary small">Patient data is hidden until your next shift starts.</div></div>
  <div id="main">
    <div class="row g-3 mb-3">
      <div class="col-lg-6"><div class="glass p-3 h-100"><b><i class="bi bi-clipboard-check"></i> My tasks</b><div id="tasks" class="mt-2"></div></div></div>
      <div class="col-lg-6"><div class="glass p-3 h-100"><b><i class="bi bi-box-arrow-in-right"></i> Incoming from registration (HL7)</b>
        <div class="table-responsive mt-2"><table class="table table-sm align-middle mb-0"><thead><tr><th>Time</th><th>Patient</th><th>Go to</th><th>Acuity</th><th>Bring</th></tr></thead><tbody id="inc"></tbody></table></div></div></div>
    </div>
    <div class="row g-3">
      <div class="col-lg-6"><div class="glass p-3 h-100"><b><i class="bi bi-person-lines-fill"></i> My patients</b>
        <div class="table-responsive mt-2"><table class="table table-sm align-middle mb-0"><thead><tr><th>Patient</th><th>Bed</th><th>Unit</th><th>Acuity</th><th>Recovery</th></tr></thead><tbody id="pts"></tbody></table></div></div></div>
      <div class="col-lg-6"><div class="glass p-3 h-100"><b><i class="bi bi-hdd-network"></i> Free equipment</b><div id="eq" class="mt-2"></div></div></div>
    </div>
  </div>
</main>
<script>
const CSRF=document.querySelector('meta[name=csrf-token]').content,$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':CSRF},body:JSON.stringify(b||{})});
async function logout(){await post('/logout/');location='/login/'}
document.addEventListener('mousemove',e=>{const t=e.target.closest('.tilt');document.querySelectorAll('.tilt').forEach(x=>{if(x!==t)x.style.transform=''});
  if(!t)return;const r=t.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
  t.style.transform=`perspective(600px) rotateX(${-py*8}deg) rotateY(${px*8}deg) translateZ(5px)`});
const ICON={wheelchair:'bi-person-wheelchair',ventilator:'bi-lungs',pump:'bi-droplet-half'};
function render(d){
  $('#who').textContent=d.name;$('#shift').textContent=`Shift ${d.shift.label} | ${d.shift.hours_left} h left`;
  $('#off').classList.toggle('d-none',d.on_duty);$('#main').classList.toggle('d-none',!d.on_duty);
  if(!d.on_duty)return;
  $('#doc').textContent=d.doctor;
  $('#tasks').innerHTML=d.tasks.map(t=>`<div class="glass p-3 mb-2 tilt t${t.priority>=2?2:1}" style="opacity:${t.status=='done'?.55:1}">
    <div class="d-flex justify-content-between"><b>${esc(t.title)}</b><span class="badge text-bg-${t.status=='done'?'success':t.status=='doing'?'info':'secondary'}">${t.status}</span></div>
    <div class="small text-secondary">${esc(t.detail)}</div>
    <div class="small mt-1">${t.from?`<i class="bi bi-geo-alt"></i> ${esc(t.from)} <i class="bi bi-arrow-right"></i> `:'<i class="bi bi-geo-alt"></i> '}${esc(t.to)}${t.patient?` | patient ${esc(t.patient)}`:''}</div>
    ${t.equipment?`<div class="small"><i class="bi bi-box-seam"></i> Bring: ${esc(t.equipment)}</div>`:''}
    <div class="small text-secondary">Assigned by ${esc(t.by)}</div>
    ${t.status=='todo'?`<button class="btn btn-sm btn-outline-info mt-2" onclick="mark(${t.id},'doing')">Start</button>`:''}
    ${t.status=='doing'?`<button class="btn btn-sm btn-success mt-2" onclick="mark(${t.id},'done')"><i class="bi bi-check-lg"></i> Mark done</button>`:''}</div>`).join('')
    ||'<div class="text-center text-secondary py-4"><i class="bi bi-cup-hot fs-1"></i><div class="mt-2">No tasks. Your doctor will assign work here.</div></div>';
  $('#inc').innerHTML=d.incoming.map(r=>`<tr><td>${r.at}</td><td>${esc(r.ref)}</td><td>${esc(r.to)}</td><td><span class="badge text-bg-${r.acuity<=2?'danger':r.acuity==3?'warning':'success'}">${r.acuity}</span></td><td class="small">${esc(r.equipment)}</td></tr>`).join('')||'<tr><td colspan="5" class="text-secondary">No new arrivals for you</td></tr>';
  $('#pts').innerHTML=d.patients.map(p=>`<tr><td>${esc(p.ref)}</td><td>${esc(p.bed)}</td><td>${esc(p.unit)}</td><td><span class="badge text-bg-${p.acuity<=2?'danger':p.acuity==3?'warning':'success'}">${p.acuity}</span></td>
    <td style="min-width:100px"><div class="progress" style="height:8px"><div class="progress-bar bg-success" style="width:${p.progress}%"></div></div></td></tr>`).join('')||'<tr><td colspan="5" class="text-secondary">No patients assigned</td></tr>';
  $('#eq').innerHTML=d.equipment.map(g=>`<div class="d-flex justify-content-between small py-1 border-bottom border-secondary-subtle"><span><i class="bi ${ICON[g.type]||'bi-box'}"></i> ${esc(g.name)}</span><span class="text-secondary">${esc(g.where)}</span></div>`).join('')||'<div class="text-secondary small">No free equipment right now</div>';
}
async function mark(id,st){await post(`/api/nurse/tasks/${id}/status`,{status:st});poll()}
async function poll(){try{const r=await fetch('/api/nurse/board');if(r.status===401||r.status===403){location='/login/';return}render(await r.json())}catch(e){}}
poll();setInterval(poll,3000);
</script>
</body>
</html>
