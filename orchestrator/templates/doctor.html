<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="__CSRF__"><title>EuTaxo | Doctor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{--ok:#2ee59d;--warn:#ffb020;--bad:#ff5470;--acc:#6ea8ff}
body{min-height:100vh;color:#e8ecf8;background:radial-gradient(1000px 500px at 5% -10%,#18295a,transparent 60%),radial-gradient(800px 450px at 100% 0,#2d1856,transparent 55%),#070b16}
.glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;backdrop-filter:blur(14px)}
.tilt{transition:transform .15s;transform-style:preserve-3d}.sug{border-left:4px solid var(--bad)}.kv{font-size:1.8rem;font-weight:700}
</style>
</head>
<body>
<nav class="glass d-flex flex-wrap justify-content-between align-items-center gap-2 px-3 py-2 m-3 mb-2">
  <span class="fs-5 fw-bold"><i class="bi bi-heart-pulse-fill text-danger"></i> EuTaxo <span style="color:var(--acc)">Doctor</span></span>
  <span class="small"><i class="bi bi-person-badge"></i> <span id="who">__NAME__</span> | <i class="bi bi-clock"></i> <span id="shift"></span></span>
  <button class="btn btn-sm btn-outline-secondary" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Log out</button>
</nav>
<main class="container-fluid px-3 pb-4">
  <div id="off" class="glass p-5 text-center d-none"><i class="bi bi-moon-stars fs-1 text-secondary"></i>
    <div class="fs-5 mt-2">You are off shift</div><div class="text-secondary small">Patient data is hidden until your next shift starts.</div></div>
  <div id="main">
    <div class="row g-3 mb-3" id="sit"></div>
    <div class="row g-3 mb-3">
      <div class="col-lg-7"><div class="glass p-3 h-100"><b><i class="bi bi-lightbulb"></i> Suggestions for your patients</b><div id="sugs" class="mt-2"></div></div></div>
      <div class="col-lg-5"><div class="glass p-3 h-100"><b><i class="bi bi-people"></i> Your nurses</b><div id="nurses" class="mt-2"></div></div></div>
    </div>
    <div class="row g-3">
      <div class="col-lg-7"><div class="glass p-3 h-100"><b><i class="bi bi-person-lines-fill"></i> Your patients</b>
        <div class="table-responsive mt-2"><table class="table table-sm align-middle mb-0"><thead><tr><th>Patient</th><th>Bed</th><th>Unit</th><th>Acuity</th><th>Recovery</th><th>Nurse</th></tr></thead><tbody id="pts"></tbody></table></div></div></div>
      <div class="col-lg-5"><div class="glass p-3 h-100"><b><i class="bi bi-list-check"></i> Recent assignments</b><ul class="list-unstyled small mt-2 mb-0" id="recent"></ul></div></div>
    </div>
  </div>
</main>
<script>
const CSRF=document.querySelector('meta[name=csrf-token]').content,$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':CSRF},body:JSON.stringify(b||{})});
async function logout(){await post('/logout/');location='/login/'}
document.addEventListener('mousemove',e=>{const t=e.target.closest('.tilt');document.querySelectorAll('.tilt').forEach(x=>{if(x!==t)x.style.transform=''});
  if(!t)return;const r=t.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
  t.style.transform=`perspective(600px) rotateX(${-py*8}deg) rotateY(${px*8}deg) translateZ(5px)`});
let sig='';
function render(d){
  $('#who').textContent=d.name;$('#shift').textContent=`Shift ${d.shift.label} | ${d.shift.hours_left} h left`;
  $('#off').classList.toggle('d-none',d.on_duty);$('#main').classList.toggle('d-none',!d.on_duty);
  if(!d.on_duty)return;
  const s=d.situation,bad='var(--bad)',ok='var(--ok)';
  $('#sit').innerHTML=[['Critical waiting',s.critical_queue,s.critical_queue>0?bad:ok],['ED queue',s.ed_queue,s.ed_queue>5?bad:ok],['Free ED beds',s.free_ed,s.free_ed==0?bad:ok],['Free ICU beds',s.free_icu,s.free_icu==0?bad:ok]]
    .map(x=>`<div class="col-6 col-lg-3"><div class="glass p-3 tilt"><div class="small text-secondary">${x[0]}</div><div class="kv" style="color:${x[2]}">${x[1]}</div></div></div>`).join('');
  const ns=JSON.stringify(d.suggestions.map(x=>x.id));
  if(ns!==sig){sig=ns;
    $('#sugs').innerHTML=d.suggestions.length?d.suggestions.map(x=>`<div class="sug glass p-3 mb-2">
      <div class="d-flex justify-content-between"><b>Discharge ${esc(x.patient)}</b><span class="badge text-bg-warning">${esc(x.bed)} | ${esc(x.unit)}</span></div>
      <div class="small text-secondary">Recovery ${x.progress}% | acuity ${x.acuity}</div>
      <ul class="small ps-3 my-2">${x.reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
      <div class="d-flex gap-2 align-items-center flex-wrap"><span class="small">Assign to</span>
        <select id="n${x.id}" class="form-select form-select-sm w-auto">${d.nurses.map(n=>`<option value="${n.id}" ${n.id===x.suggested_nurse?'selected':''}>${esc(n.name)}${n.id===x.suggested_nurse?' (suggested)':''}</option>`).join('')}</select>
        <button class="btn btn-success btn-sm" onclick="decide(${x.id},'accept')"><i class="bi bi-check-lg"></i> Accept</button>
        <button class="btn btn-outline-danger btn-sm" onclick="decide(${x.id},'decline')"><i class="bi bi-x-lg"></i> Decline</button></div></div>`).join('')
      :'<div class="text-center text-secondary py-4"><i class="bi bi-shield-check fs-1" style="color:var(--ok)"></i><div class="mt-2">No bed-pressure suggestions right now.</div></div>';}
  $('#nurses').innerHTML=d.nurses.map(n=>`<div class="glass p-3 mb-2 tilt"><div class="d-flex justify-content-between"><b>${esc(n.name)}</b><span class="badge text-bg-${n.open_tasks>2?'danger':'secondary'}">${n.open_tasks} open task(s)</span></div>
    <div class="small text-secondary mt-1">${n.patients.length?n.patients.map(p=>`${esc(p.bed)} (${esc(p.unit)})`).join(', '):'No patients assigned'}</div>
    ${n.tasks.map(t=>`<div class="small mt-1"><i class="bi bi-arrow-right-short"></i> ${esc(t.title)} <span class="text-secondary">[${t.status}]</span></div>`).join('')}</div>`).join('');
  $('#pts').innerHTML=d.patients.map(p=>`<tr><td>${esc(p.ref)}</td><td>${esc(p.bed)}</td><td>${esc(p.unit)}</td><td><span class="badge text-bg-${p.acuity<=2?'danger':p.acuity==3?'warning':'success'}">${p.acuity}</span></td>
    <td style="min-width:110px"><div class="progress" style="height:8px"><div class="progress-bar bg-success" style="width:${p.progress}%"></div></div></td><td>${esc(p.nurse)}</td></tr>`).join('')||'<tr><td colspan="6" class="text-secondary">No patients yet</td></tr>';
  $('#recent').innerHTML=d.recent.map(r=>`<li class="py-1 border-bottom border-secondary-subtle"><span class="text-secondary">${r.at}</span> ${esc(r.title)}<br><span class="text-secondary">${esc(r.nurse)} | ${r.status}</span></li>`).join('')||'<li class="text-secondary">Nothing assigned yet</li>';
}
async function decide(id,dec){const sel=document.getElementById('n'+id);
  const r=await post(`/api/doctor/suggestions/${id}/decide`,{decision:dec,nurse_id:sel?sel.value:null});
  if(!r.ok){const j=await r.json().catch(()=>({}));alert(j.error||'Action failed')}poll()}
async function poll(){try{const r=await fetch('/api/doctor/board');if(r.status===401||r.status===403){location='/login/';return}render(await r.json())}catch(e){}}
poll();setInterval(poll,3000);
</script>
</body>
</html>
