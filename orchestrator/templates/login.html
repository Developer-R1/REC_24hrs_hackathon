<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="__CSRF__"><title>EuTaxo AI | Sign in</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
body{min-height:100vh;display:grid;place-items:center;color:#e8ecf8;background:radial-gradient(1000px 500px at 10% -10%,#18295a,transparent 60%),radial-gradient(800px 450px at 100% 0,#2d1856,transparent 55%),#070b16}
.glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;backdrop-filter:blur(16px);width:min(92vw,400px)}
</style>
</head>
<body>
<div class="glass p-4">
  <div class="text-center mb-3"><i class="bi bi-heart-pulse-fill text-danger fs-1"></i>
    <div class="fs-4 fw-bold">EuTaxo <span style="color:#6ea8ff">AI</span></div>
    <div class="small text-secondary">Authorized hospital staff only. All access is logged.</div></div>
  <div id="err" class="alert alert-danger py-2 d-none"></div>
  <div class="mb-3"><label class="form-label small">Username</label><input id="u" class="form-control" autocomplete="username" autofocus></div>
  <div class="mb-3"><label class="form-label small">Password</label><input id="p" type="password" class="form-control" autocomplete="current-password"></div>
  <button id="go" class="btn btn-primary w-100"><i class="bi bi-shield-lock"></i> Sign in</button>
</div>
<script>
const CSRF=document.querySelector('meta[name=csrf-token]').content,$=s=>document.querySelector(s);
async function go(){
  $('#go').disabled=true;$('#err').classList.add('d-none');
  try{
    const r=await fetch('/login/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':CSRF},body:JSON.stringify({username:$('#u').value,password:$('#p').value})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){location=j.next;return}
    $('#err').textContent=j.error||'Sign in failed';$('#err').classList.remove('d-none');$('#p').value='';
  }catch(e){$('#err').textContent='Cannot reach the server';$('#err').classList.remove('d-none')}
  $('#go').disabled=false;
}
$('#go').onclick=go;document.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script>
</body>
</html>
